name: Draft Release
on:
  push:
    branches:
      - main

concurrency:
  group: ci-pre-release
  cancel-in-progress: true

# The job below states what it needs; this only stops the workflow from
# inheriting the repository default.
permissions: {}

jobs:
  draft_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Draft Release
        uses: release-drafter/release-drafter@v7
        with:
          publish: false
          token: ${{ secrets.GITHUB_TOKEN }}
