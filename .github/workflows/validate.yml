name: Validate the source code
on:
  workflow_call:
    inputs:
      terraform_directory:
        required: false
        type: string
        description: "Directory in which the Terraform configuration is available"
        default: "."
    secrets:
      GH_TOKEN:
        required: true
        description: "GitHub token to access the repository"

# Every job below states what it needs; this only stops the workflow from
# inheriting the repository default.
permissions: {}

# Pinned, not read from .terraform-docs.yml: that holds a `>=` floor, and
# --output-check needs one exact version. Bump alongside the constraint.
env:
  TERRAFORM_DOCS_VERSION: 0.20.0

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      contents: read # for actions/checkout to fetch code
      issues: read # for publish-unit-test-result-action to read issues
      checks: write # for publish-unit-test-result-action to create checks
      pull-requests: write # for publish-unit-test-result-action to comment on PRs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Terraform format
        id: tf-fmt
        run: terraform -chdir=${{inputs.terraform_directory}} fmt -check -recursive
        continue-on-error: true
      - name: Terraform init
        id: tf-init
        run: terraform -chdir=${{inputs.terraform_directory}} init
      - name: Terraform validate
        id: tf-validate
        run: terraform -chdir=${{inputs.terraform_directory}} validate -no-color
      - name: Terraform test
        id: tf-test
        run: terraform -chdir=${{inputs.terraform_directory}} test -junit-xml=test-results.xml
        continue-on-error: true

      # Fork PRs get a read-only token, so this cannot publish there. The gate
      # at the end of the job is what fails on a real test failure.
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          files: |
            ${{inputs.terraform_directory}}/test-results.xml
          check_name: Terraform Test Results
          comment_mode: always
          deduplicate_classes_by_file_name: false

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: terraform-test-results
          path: ${{inputs.terraform_directory}}/test-results.xml
          retention-days: 30

      # After the publish steps, so a lint failure still leaves test results on
      # the PR.
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: TFLint
        id: tflint
        working-directory: ${{inputs.terraform_directory}}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} # rate limit on plugin download
        run: |
          # no-op until a module adds an external ruleset
          tflint --init
          # --recursive covers examples/, and reruns tflint from each directory,
          # so the config needs an absolute path.
          tflint --recursive --config="$(pwd)/.tflint.hcl" --format compact

      - name: Checkov validation
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{inputs.terraform_directory}}
          output_format: cli
          output_file_path: console
          config_file: ${{inputs.terraform_directory}}/.checkov-config.yml

      # The BEGIN_TF_DOCS block is the module's interface, so CI checks it
      # rather than trusting the hook.
      - name: Setup terraform-docs
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: terraform-docs/terraform-docs
          tag: v${{ env.TERRAFORM_DOCS_VERSION }}
          cache: true

      - name: terraform-docs is up to date
        id: tf-docs
        working-directory: ${{inputs.terraform_directory}}
        run: terraform-docs -c .terraform-docs.yml . --output-check

      # fmt and test use continue-on-error so results still publish; fail here.
      - name: Fail on format or test errors
        if: steps.tf-fmt.outcome != 'success' || steps.tf-test.outcome != 'success'
        run: |
          echo "terraform fmt outcome:  ${{ steps.tf-fmt.outcome }}"
          echo "terraform test outcome: ${{ steps.tf-test.outcome }}"
          exit 1

  # Each example is its own root module, so the job above never loads them.
  examples:
    runs-on: ubuntu-latest

    permissions:
      contents: read # for actions/checkout to fetch code

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Terraform validate examples
        run: |
          for dir in examples/*/; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -no-color
            terraform -chdir="${dir}" validate -no-color
            echo "::endgroup::"
          done
